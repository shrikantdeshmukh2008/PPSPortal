spring.application.name=gateway-service

# JWT Secret Key (must be 32+ chars)
jwt.secret=mysecretkey1234567890mysecretkey1234567890

# Server port
server.port=8080

# Gateway routes
#spring.cloud.gateway.routes[0].id=ff-oms-integration-service
#spring.cloud.gateway.routes[0].uri=lb://ff-oms-integration-service
#spring.cloud.gateway.routes[0].predicates[0]=Path=/oms/**

spring.cloud.gateway.server.webflux.routes[0].id=ff-user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ff-user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/users/**

spring.cloud.gateway.server.webflux.routes[1].id=ff-oms-integration-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ff-oms-integration-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/oms/**


spring.cloud.gateway.server.webflux.routes[2].id=ff-inventory-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ff-inventory-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/inventory/**

spring.cloud.gateway.server.webflux.routes[3].id=ff-fulfillment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ff-fulfillment-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/fulfillment/**

spring.cloud.gateway.server.webflux.routes[4].id=ff-shipping-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ff-shipping-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/shipping/**

# Eureka client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
